<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Accessory Dock</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Logo" class="logo" />
    <input id="search" type="text" placeholder="Search accessories..." />
    <button onclick="toggleCart()">🛒 View Cart</button>
  </header>

  <nav id="categories"></nav>

  <main id="products"></main>

  <!-- Product Detail Modal -->
  <div id="product-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">×</span>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Cart Drawer -->
<aside id="cart-drawer">
  <h3>Cart</h3>
  <div id="cart-items"></div>

  <!-- Refer Code Field -->
  <div style="margin-top: 1rem;">
    <input id="cart-refer-input" type="text" placeholder="Enter Refer Code" />
  </div>

  <div id="coupon-section">
    <input id="coupon-input" type="text" placeholder="Enter coupon code" />
    <button onclick="applyCoupon()">Apply</button>
    <p id="coupon-feedback"></p>
    <p id="coupon-breakdown"></p>
  </div>

  <p id="cart-total">Total: रु 0</p>
  <button onclick="checkoutWhatsApp()">Checkout via WhatsApp</button>
</aside>


  <!-- Cart overlay for click-to-close -->
  <div id="cart-overlay" class="cart-overlay hidden" onclick="toggleCart()"></div>

  <footer>
    <p id="cart-summary">0 items | रु 0</p>
    <p>© The Accessory Dock</p>
  </footer>

  <script src="script.js"></script>
  <div id="toast" class="toast hidden">Item added to cart</div>
</body>
</html>
