<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>The Accessory Dock – Mobile & Tech Accessories Nepal</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header: Mobile-First Responsive Navigation -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-top">
        <div class="brand">
          <img src="images/logo.png" alt="The Accessory Dock" class="logo" />
          <span class="brand-name">The Accessory Dock</span>
        </div>
        <button id="cart-toggle-btn" class="cart-btn" aria-label="Open cart">
          🛒 <span class="cart-text">Cart</span>
          <span id="cart-badge" class="cart-badge">0</span>
        </button>
      </div>
      <div class="header-search">
        <input id="search" type="search" placeholder="Search accessories, audio, chargers..." aria-label="Search products" autocomplete="off" />
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-inner">
      <h1>Quality Accessories. Great Prices.</h1>
      <p>Curated audio, power and lifestyle gear — ready to ship across Nepal.</p>
      <div class="trust-chips">
        <span class="trust-chip">🛡️ Genuine Products</span>
        <span class="trust-chip">⚡ Fast Delivery</span>
        <span class="trust-chip">💬 WhatsApp Orders</span>
      </div>
    </div>
  </section>

  <!-- Categories Bar -->
  <nav id="categories" aria-label="Product categories"></nav>

  <!-- Main Product Grid -->
  <main id="products" aria-label="Products list"></main>

  <!-- Product Detail Modal -->
  <div id="product-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button id="modal-close-btn" class="close-btn" aria-label="Close modal">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Cart Drawer -->
  <aside id="cart-drawer" aria-label="Shopping cart">
    <div class="cart-header">
      <h3 class="cart-title">Your Cart</h3>
      <button id="cart-close-btn" class="cart-close-btn" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items" class="cart-items-body"></div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Estimated Total:</span>
        <span id="cart-total" class="cart-total">रु 0</span>
      </div>
      <button id="checkout-btn" class="checkout-btn">Checkout via WhatsApp</button>
    </div>
  </aside>

  <!-- Cart overlay for click-to-close -->
  <div id="cart-overlay" class="cart-overlay hidden"></div>

  <!-- Footer -->
  <footer>
    <div class="footer-inner">
      <p id="cart-summary">0 items | रु 0</p>
      <p>© The Accessory Dock – Kathmandu, Nepal</p>
    </div>
  </footer>

  <div id="toast" class="toast hidden" role="status">Item added to cart</div>
  <script src="script.js"></script>
</body>
</html>
